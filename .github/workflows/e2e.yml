name: Portal end-to-end tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright test runner
        run: npm install --prefix frontend --no-save --no-package-lock @playwright/test@1.56.1

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          nohup env NODE_ENV=test EMAIL_MODE=mock PORT=5000 JWT_SECRET=portal-e2e-secret-at-least-thirty-two-characters MONGODB_URI=mongodb://127.0.0.1:27017/portal_e2e npm run dev --prefix backend > /tmp/portal-backend.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5000/api/health; then
              echo "Backend is ready"
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:5000/api/health

      - name: Start frontend
        run: |
          nohup env VITE_API_URL=http://127.0.0.1:5000/api npm run dev --prefix frontend -- --host 127.0.0.1 > /tmp/portal-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then
              echo "Frontend is ready"
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:5173/ > /dev/null

      - name: Run browser end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/portal-backend.log
            /tmp/portal-frontend.log
          if-no-files-found: warn
          retention-days: 14
