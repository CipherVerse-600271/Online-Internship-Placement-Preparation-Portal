name: Sprint 2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/sprint-2-application-workflows]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check backend JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/middleware/authMiddleware.js
          node --check models/Internship.js
          node --check models/Application.js
          node --check models/Notification.js
          node --check routes/internshipRoutes.js
          node --check routes/applicationRoutes.js
          node --check routes/notificationRoutes.js

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
