services:
  - type: web
    name: oipp-team12-demo-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: API_BASE_URL
        fromService:
          type: web
          name: oipp-team12-demo-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: SMTP_HOST
        value: sandbox.smtp.mailtrap.io
      - key: SMTP_PORT
        value: "2525"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: demo@internship-portal.test

  - type: web
    runtime: static
    name: oipp-team12-demo-frontend
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: oipp-team12-demo-api
          envVarKey: RENDER_EXTERNAL_URL
